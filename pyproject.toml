[project]
name = "starrydata-mcp"
version = "0.1.0"
description = "MCP server exposing Starrydata's publicly distributed materials-science dataset (papers, samples, property curves) to AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.9.0",
    "duckdb>=1.1.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "starlette>=0.37",
    "uvicorn>=0.27",
]

[project.scripts]
starrydata-mcp = "starrydata_mcp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starrydata_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=starrydata_mcp --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/starrydata_mcp"]

[tool.coverage.report]
exclude_also = [
    ":\\s*\\.\\.\\.\\s*$",     # Protocol method stub bodies (domain/repositories.py)
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["starrydata_mcp.domain", "starrydata_mcp.application"]

[tool.importlinter]
root_package = "starrydata_mcp"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean architecture layering"
type = "layers"
layers = [
    "starrydata_mcp.interface",
    "starrydata_mcp.infrastructure | starrydata_mcp.application",
    "starrydata_mcp.domain",
]

[[tool.importlinter.contracts]]
name = "Domain has zero outward dependencies"
type = "forbidden"
source_modules = ["starrydata_mcp.domain"]
forbidden_modules = [
    "starrydata_mcp.application",
    "starrydata_mcp.infrastructure",
    "starrydata_mcp.interface",
    "duckdb",
    "mcp",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "Application never reaches into infrastructure or interface"
type = "forbidden"
source_modules = ["starrydata_mcp.application"]
forbidden_modules = [
    "starrydata_mcp.infrastructure",
    "starrydata_mcp.interface",
    "duckdb",
    "mcp",
    "httpx",
]
