name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Type check (mypy, domain+application only)
        run: uv run mypy
      - name: Enforce clean-architecture layering (import-linter)
        run: uv run lint-imports
      - name: Test with coverage gate
        run: uv run pytest --cov-fail-under=85
